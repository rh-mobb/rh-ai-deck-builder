name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: decks/*/node_modules
          key: ${{ runner.os }}-decks-${{ hashFiles('decks/*/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-decks-

      - name: Build example decks
        run: |
          mkdir -p public/decks
          for deck_dir in decks/*/; do
            deck=$(basename "$deck_dir")
            if [ ! -f "${deck_dir}slides.md" ]; then
              echo "Skipping $deck (no slides.md)"
              continue
            fi
            echo "=== Building deck: $deck ==="
            (cd "$deck_dir" && npm install && npx slidev build slides.md --base "/mobb-deck-template/decks/${deck}/")
            cp -r "${deck_dir}dist/." "public/decks/${deck}/"
          done

      - name: Generate index page
        run: |
          python3 << 'EOF'
          import os
          import re

          def get_title(deck_dir):
              slides = os.path.join(deck_dir, 'slides.md')
              try:
                  content = open(slides).read()
                  m = re.search(r'^---\n(.*?)\n---', content, re.DOTALL)
                  if m:
                      for line in m.group(1).splitlines():
                          if line.startswith('title:'):
                              return line[6:].strip().strip('"').strip("'")
              except Exception:
                  pass
              return os.path.basename(deck_dir)

          decks = []
          for name in sorted(os.listdir('decks')):
              path = os.path.join('decks', name)
              if os.path.isdir(path) and os.path.exists(os.path.join(path, 'slides.md')):
                  decks.append((name, get_title(path)))

          items = '\n'.join(
              f'<li><a href="decks/{name}/"><strong>{title}</strong>'
              f'<span class="name">{name}</span></a></li>'
              for name, title in decks
          )

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>mobb-deck-template &middot; Example Decks</title>
            <style>
              *, *::before, *::after {{ box-sizing: border-box; margin: 0; padding: 0; }}
              body {{
                font-family: "Red Hat Display", "Red Hat Text", system-ui, sans-serif;
                background: #151515;
                color: #f2f2f2;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
              }}
              header {{
                background: #1a1a1a;
                border-bottom: 3px solid #ee0000;
                padding: 2rem 3rem;
              }}
              .hat {{
                color: #ee0000;
                font-size: 0.9rem;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
              }}
              header h1 {{ font-size: 2rem; font-weight: 700; color: #fff; }}
              header p {{ margin-top: 0.5rem; color: #aaa; font-size: 1rem; }}
              main {{ max-width: 820px; margin: 3rem auto; padding: 0 2rem; flex: 1; width: 100%; }}
              h2 {{
                font-size: 0.9rem;
                font-weight: 600;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 1.5rem;
              }}
              ul {{ list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }}
              li a {{
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
                padding: 1.25rem 1.5rem;
                background: #1f1f1f;
                border: 1px solid #333;
                border-left: 4px solid #ee0000;
                border-radius: 4px;
                text-decoration: none;
                transition: background 0.15s;
              }}
              li a:hover {{ background: #272727; }}
              li a strong {{ color: #fff; font-size: 1.05rem; }}
              .name {{ color: #666; font-size: 0.8rem; font-family: monospace; margin-top: 0.1rem; }}
              footer {{
                text-align: center;
                padding: 2rem;
                color: #555;
                font-size: 0.85rem;
                border-top: 1px solid #222;
              }}
              footer a {{ color: #777; text-decoration: none; }}
              footer a:hover {{ color: #aaa; }}
            </style>
          </head>
          <body>
            <header>
              <div class="hat">Red Hat &middot; MOBB</div>
              <h1>mobb-deck-template</h1>
              <p>Example slide decks built with the Red Hat Slidev theme</p>
            </header>
            <main>
              <h2>Example Decks</h2>
              <ul>
                {items}
              </ul>
            </main>
            <footer>
              <a href="https://github.com/rh-mobb/mobb-deck-template">github.com/rh-mobb/mobb-deck-template</a>
            </footer>
          </body>
          </html>"""

          with open('public/index.html', 'w') as f:
              f.write(html)
          print(f"Generated index with {len(decks)} deck(s): {[d[0] for d in decks]}")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
